[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "incidentinterval"
version = "0.1.0"
description = "Evidence-linked incident hypotheses with integer interval constraints and bounded counterfactuals"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "lllleolin-max"}]
readme = "README.md"
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.scripts]
incidentinterval = "incidentinterval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
